name: Validate Release Hardening v88
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  release-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release hardening v88
        run: node scripts/validate-release-hardening-v87.mjs
      - name: Verify v88 hardening on production Worker
        if: github.event_name == 'push'
        run: |
          base='https://oee-collaboraction.offsetbmj.workers.dev'
          ready=0
          for attempt in $(seq 1 24); do
            html=$(curl --silent --show-error --location --max-time 20 "$base/" || true)
            response_headers=$(curl --silent --show-error --location --max-time 20 -D - -o /dev/null "$base/" || true)
            gate=$(curl --silent --show-error --location --max-time 20 "$base/release-runtime-gate-v87.js" || true)
            dash=$(curl --silent --show-error --location --max-time 20 "$base/premium-dashboard-integrity-v88.js" || true)
            page=$(curl --silent --show-error --location --max-time 20 "$base/page-integrity-v66.js" || true)
            live=$(curl --silent --show-error --location --max-time 20 "$base/live-monitoring-v71.js" || true)
            role=$(curl --silent --show-error --location --max-time 20 "$base/role-dashboard-v12.js" || true)
            ui=$(curl --silent --show-error --location --max-time 20 "$base/app-ui.js" || true)
            ok=1
            printf '%s' "$html" | grep -Fq 'release-runtime-gate-v87.js?v=20260916-1' || ok=0
            printf '%s' "$html" | grep -Fq 'premium-dashboard-integrity-v88.js?v=20260916-1' || ok=0
            printf '%s' "$html" | grep -Fq 'page-integrity-v66.js?v=20260916-2' || ok=0
            printf '%s' "$gate" | grep -Fq 'Verifikasi runtime…' || ok=0
            printf '%s' "$gate" | grep -Fq 'verifyDashboardProjection' || ok=0
            printf '%s' "$dash" | grep -Fq 'periode berasal dari cell tanggal sumber' || ok=0
            printf '%s' "$dash" | grep -Fq 'tidak menebak periode dari nama file atau posisi baris' || ok=0
            printf '%s' "$page" | grep -Fq 'Metadata audit keputusan belum dapat diverifikasi.' || ok=0
            printf '%s' "$live" | grep -Fq 'Pembaruan realtime terputus.' || ok=0
            printf '%s' "$role" | grep -Fq 'KPI operasional belum dapat dimuat.' || ok=0
            printf '%s' "$ui" | grep -Fq 'Pembaruan Pusat Perhatian tertunda.' || ok=0
            printf '%s' "$response_headers" | grep -Fiq 'x-content-type-options: nosniff' || ok=0
            printf '%s' "$response_headers" | grep -Fiq 'x-frame-options: DENY' || ok=0
            printf '%s' "$response_headers" | grep -Fiq 'referrer-policy: strict-origin-when-cross-origin' || ok=0
            if [ "$ok" = '1' ]; then
              echo "Production Worker converged with release hardening v88 and static security headers on attempt $attempt"
              ready=1
              break
            fi
            echo "Waiting for production convergence ($attempt/24)"
            sleep 5
          done
          test "$ready" = '1'
