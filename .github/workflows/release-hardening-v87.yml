name: Validate Release Hardening v91
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  release-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release hardening v90
        run: node scripts/validate-release-hardening-v87.mjs
      - name: Validate route-specific flagship coverage v91
        run: node scripts/validate-flagship-pages-v91.mjs
      - name: Verify v91 hardening on production Worker
        if: github.event_name == 'push'
        run: |
          base='https://oee-collaboraction.offsetbmj.workers.dev'
          ready=0
          for attempt in $(seq 1 24); do
            html=$(curl --silent --show-error --location --max-time 20 "$base/" || true)
            response_headers=$(curl --silent --show-error --location --max-time 20 -D - -o /dev/null "$base/" || true)
            core=$(curl --silent --show-error --location --max-time 20 "$base/app-core.js" || true)
            gate=$(curl --silent --show-error --location --max-time 20 "$base/release-runtime-gate-v87.js" || true)
            dash=$(curl --silent --show-error --location --max-time 20 "$base/premium-dashboard-integrity-v88.js" || true)
            flagship_js=$(curl --silent --show-error --location --max-time 20 "$base/flagship-v89.js?v=20260917-1" || true)
            flagship_css=$(curl --silent --show-error --location --max-time 20 "$base/flagship-v89.css?v=20260917-1" || true)
            depth_js=$(curl --silent --show-error --location --max-time 20 "$base/flagship-depth-v90.js?v=20260917-1" || true)
            depth_css=$(curl --silent --show-error --location --max-time 20 "$base/flagship-depth-v90.css?v=20260917-1" || true)
            pages_js=$(curl --silent --show-error --location --max-time 20 "$base/flagship-pages-v91.js?v=20260917-1" || true)
            pages_css=$(curl --silent --show-error --location --max-time 20 "$base/flagship-pages-v91.css?v=20260917-1" || true)
            page=$(curl --silent --show-error --location --max-time 20 "$base/page-integrity-v66.js" || true)
            live=$(curl --silent --show-error --location --max-time 20 "$base/live-monitoring-v71.js" || true)
            role=$(curl --silent --show-error --location --max-time 20 "$base/role-dashboard-v12.js" || true)
            ui=$(curl --silent --show-error --location --max-time 20 "$base/app-ui.js" || true)
            ok=1
            printf '%s' "$html" | grep -Fq '<script defer src="config.js"></script>' || ok=0
            printf '%s' "$html" | grep -Fq 'rel="preload" href="assets/logo-bmj-source.webp"' || ok=0
            printf '%s' "$html" | grep -Fq 'rel="preload" href="assets/hero-bmj-photo.jpg"' || ok=0
            printf '%s' "$html" | grep -Fq 'release-runtime-gate-v87.js?v=20260916-1' || ok=0
            printf '%s' "$html" | grep -Fq 'premium-dashboard-integrity-v88.js?v=20260916-1' || ok=0
            printf '%s' "$html" | grep -Fq 'flagship-v89.css?v=20260917-1' || ok=0
            printf '%s' "$html" | grep -Fq 'flagship-v89.js?v=20260917-1' || ok=0
            printf '%s' "$html" | grep -Fq 'flagship-depth-v90.css?v=20260917-1' || ok=0
            printf '%s' "$html" | grep -Fq 'flagship-depth-v90.js?v=20260917-1' || ok=0
            printf '%s' "$html" | grep -Fq 'flagship-pages-v91.css?v=20260917-1' || ok=0
            printf '%s' "$html" | grep -Fq 'flagship-pages-v91.js?v=20260917-1' || ok=0
            printf '%s' "$html" | grep -Fq 'page-integrity-v66.js?v=20260916-2' || ok=0
            printf '%s' "$core" | grep -Fq 'Sesi berakhir. Silakan login kembali.' || ok=0
            printf '%s' "$core" | grep -Fq 'Perangkat sedang offline. Sambungkan jaringan lalu coba lagi.' || ok=0
            printf '%s' "$core" | grep -Fq 'Tidak dapat terhubung ke server OEE.' || ok=0
            printf '%s' "$gate" | grep -Fq 'Verifikasi runtime…' || ok=0
            printf '%s' "$gate" | grep -Fq 'Verifikasi ulang runtime' || ok=0
            printf '%s' "$gate" | grep -Fq 'verifyDashboardProjection' || ok=0
            printf '%s' "$dash" | grep -Fq 'periode berasal dari cell tanggal sumber' || ok=0
            printf '%s' "$dash" | grep -Fq 'tidak menebak periode dari nama file atau posisi baris' || ok=0
            printf '%s' "$dash" | grep -Fq 'KPI authoritative' || ok=0
            printf '%s' "$dash" | grep -Fq 'KPI belum authoritative' || ok=0
            printf '%s' "$flagship_js" | grep -Fq 'classifyPanels' || ok=0
            printf '%s' "$flagship_js" | grep -Fq 'dialogKind' || ok=0
            printf '%s' "$flagship_css" | grep -Fq -- '--f89-navy:#071426' || ok=0
            printf '%s' "$flagship_css" | grep -Fq 'dialog[data-flagship-dialog="wide"]' || ok=0
            printf '%s' "$depth_js" | grep -Fq 'confirmDialog' || ok=0
            printf '%s' "$depth_js" | grep -Fq '#deleteRow' || ok=0
            printf '%s' "$depth_js" | grep -Fq '#delEntry' || ok=0
            printf '%s' "$depth_css" | grep -Fq 'dialog.flagship-confirm-v90' || ok=0
            printf '%s' "$depth_css" | grep -Fq '#fieldDisplay' || ok=0
            printf '%s' "$depth_css" | grep -Fq '.display-pairing-card' || ok=0
            printf '%s' "$depth_css" | grep -Fq '.runtime-state-spinner' || ok=0
            printf '%s' "$pages_js" | grep -Fq 'Department Workspace' || ok=0
            printf '%s' "$pages_js" | grep -Fq 'Realtime Operations' || ok=0
            printf '%s' "$pages_js" | grep -Fq 'Release Governance' || ok=0
            printf '%s' "$pages_css" | grep -Fq 'data-ui-view="documents"' || ok=0
            printf '%s' "$pages_css" | grep -Fq 'data-ui-view="quality"' || ok=0
            printf '%s' "$pages_css" | grep -Fq 'data-ui-view="shopfloor"' || ok=0
            printf '%s' "$pages_css" | grep -Fq 'data-ui-view="approvals"' || ok=0
            printf '%s' "$pages_css" | grep -Fq 'data-ui-view="uat-release"' || ok=0
            printf '%s' "$pages_css" | grep -Fq 'data-ui-view="integrations"' || ok=0
            printf '%s' "$page" | grep -Fq 'Metadata audit keputusan belum dapat diverifikasi.' || ok=0
            printf '%s' "$live" | grep -Fq 'Pembaruan realtime terputus.' || ok=0
            printf '%s' "$role" | grep -Fq 'KPI operasional belum dapat dimuat.' || ok=0
            printf '%s' "$ui" | grep -Fq 'Pembaruan Pusat Perhatian tertunda.' || ok=0
            printf '%s' "$response_headers" | grep -Fiq 'x-content-type-options: nosniff' || ok=0
            printf '%s' "$response_headers" | grep -Fiq 'x-frame-options: DENY' || ok=0
            printf '%s' "$response_headers" | grep -Fiq 'referrer-policy: strict-origin-when-cross-origin' || ok=0
            if [ "$ok" = '1' ]; then
              echo "Production Worker converged with route-specific flagship release v91 on attempt $attempt"
              ready=1
              break
            fi
            echo "Waiting for production convergence ($attempt/24)"
            sleep 5
          done
          test "$ready" = '1'
