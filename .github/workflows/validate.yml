name: Validate OEE Collaboraction
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend JavaScript
        run: |
          for f in frontend/*.js; do echo "Checking $f"; node --check "$f"; done
      - name: Validate frontend asset integrity
        run: node scripts/validate-frontend-assets.mjs
      - name: Validate role UX policy
        run: node scripts/validate-role-ux.mjs
      - name: Validate active navigation coverage
        run: node scripts/validate-navigation.mjs
      - name: Validate login and session flow
        run: node scripts/validate-auth-flow.mjs
      - name: Validate release blueprint coverage
        run: node scripts/validate-release-v10.mjs
      - name: Validate final release blueprint
        run: node scripts/validate-release-final.mjs
      - name: Validate workflow reconciliation v51
        run: node scripts/validate-workflow-v51.mjs
      - name: Validate live mirror reconciliation v52
        run: node scripts/validate-mirror-v52.mjs
      - name: Validate release polish v23
        run: node scripts/validate-release-v23.mjs
      - name: Validate module tables v25
        run: node scripts/validate-module-table-v25.mjs
      - name: Validate semantic archive v26
        run: node scripts/validate-archive-v26.mjs
      - name: Validate settings polish v27
        run: node scripts/validate-settings-v27.mjs
      - name: Validate access governance v28
        run: node scripts/validate-access-v28.mjs
      - name: Validate display lifecycle v29
        run: node scripts/validate-display-v29.mjs
      - name: Validate staged import center v30
        run: node scripts/validate-import-v30.mjs
      - name: Validate Worker modules
        run: |
          for f in backend/*.mjs edge-agent/*.mjs scripts/*.mjs; do echo "Checking $f"; node --check "$f"; done
      - name: Validate D1 SQL placeholder bindings
        run: node scripts/validate-sql-bindings.mjs
      - name: Validate backend authorization policy
        run: node scripts/validate-authz.mjs
      - name: Production Worker health check
        run: |
          curl --fail --location --max-time 20 --show-error https://oee-collaboraction.offsetbmj.workers.dev/api/health
      - name: Production build version and fingerprint check
        run: |
          body=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/api/version)
          echo "$body"
          echo "$body" | grep -Fq '"version":"6.2.0"'
          echo "$body" | grep -Fq '"storage":"D1-only"'
          echo "$body" | grep -Fq '"r2":false'
          echo "$body" | grep -Fq 'operational-control-v31'
          echo "$body" | grep -Fq 'release-resilience-v33'
          echo "$body" | grep -Fq 'period-aware-dashboard-v34'
          echo "$body" | grep -Fq 'workflow-reconciliation-v51'
          echo "$body" | grep -Fq 'mirror-reconciliation-v52'
          echo "$body" | grep -Fq 'plan-authority-v53'
          echo "$body" | grep -Fq 'runtime-signoff-v54'
          echo "$body" | grep -Fq 'runtime-invariants-v55'
          echo "$body" | grep -Fq 'integration-safety-v69'
      - name: Production D1 readiness check
        run: |
          tmp=$(mktemp)
          code=$(curl --silent --show-error --location --max-time 20 -o "$tmp" -w '%{http_code}' https://oee-collaboraction.offsetbmj.workers.dev/api/readiness)
          cat "$tmp"
          test "$code" = "200"
          grep -Fq '"ready":true' "$tmp"
          grep -Fq '"schema":"ready"' "$tmp"
      - name: Production frontend and BMJ asset smoke check
        run: |
          js_assets="role-ux-v7.js field-display-v8.js release-v10.js release-v11.js role-dashboard-v12.js workflow-v13.js governance-v14.js data-governance-core-v16.js data-governance-view-v16.js data-governance-edit-v16.js machine-governance-v20.js uat-release-core-v17.js uat-release-view-v17.js uat-release-edit-v17.js release-status-v18.js support-recovery-v21.js release-polish-v23.js module-table-v25.js archive-semantic-v26.js settings-polish-v27.js access-governance-v28.js display-lifecycle-v29.js import-center-v30.js operational-control-core-v31.js operational-control-view-v31.js operational-control-edit-v31.js operational-control-runtime-v31.js release-resilience-v33.js dashboard-period-v34.js integration-safety-v69.js navigation-integrity-v70.js live-monitoring-v71.js"
          ready=0
          for attempt in $(seq 1 12); do
            html=$(curl --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/ || true)
            ok=1
            echo "$html" | grep -Fq 'BMJ OEE Platform | Packaging Offset' || ok=0
            echo "$html" | grep -Fq 'id="app"' || ok=0
            for asset in $js_assets; do echo "$html" | grep -Fq "$asset" || ok=0; done
            if [ "$ok" = "1" ]; then
              echo "Production frontend assets visible on attempt $attempt"
              ready=1
              break
            fi
            echo "Production frontend not converged yet (attempt $attempt/12)"
            sleep 5
          done
          test "$ready" = "1"
          for asset in release-v10.css release-v11.css role-dashboard-v12.css workflow-v13.css governance-v14.css data-governance-v16.css uat-release-v17.css release-status-v18.css support-recovery-v21.css release-polish-v23.css module-table-v25.css archive-semantic-v26.css settings-polish-v27.css access-governance-v28.css display-lifecycle-v29.css import-center-v30.css operational-control-v31.css; do curl --fail --silent --show-error --location --max-time 20 -o /dev/null "https://oee-collaboraction.offsetbmj.workers.dev/$asset"; done
          curl --fail --silent --show-error --location --max-time 20 -o /dev/null https://oee-collaboraction.offsetbmj.workers.dev/assets/logo-bmj-source.webp
          curl --fail --silent --show-error --location --max-time 20 -o /dev/null https://oee-collaboraction.offsetbmj.workers.dev/assets/hero-bmj-photo.jpg
      - name: Production field display publish guard check
        run: |
          js=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/field-display-v8.js)
          echo "$js" | grep -Fq "layout.status==='published'"
          echo "$js" | grep -Fq 'Display belum siap ditayangkan'
          release=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/release-v10.js)
          echo "$release" | grep -Fq 'filter(m=>normalize(m.code)===code)'
      - name: Production release workflow smoke check
        run: |
          check(){ printf '%s' "$1" | grep -Fq "$2" || { echo "Missing production marker: $3 -> $2"; exit 1; }; }
          r10=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/release-v10.js)
          check "$r10" 'Tata Kelola & Readiness' 'release-v10'
          check "$r10" 'Pusat Data & Dokumen' 'release-v10'
          check "$r10" 'barcodePlanScan' 'release-v10'
          r11=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/release-v11.js)
          check "$r11" 'Approval & Verifikasi' 'release-v11'
          check "$r11" 'Tutup Maintenance' 'release-v11'
          r12=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/role-dashboard-v12.js)
          check "$r12" '/role-dashboard?department=' 'role-dashboard-v12'
          check "$r12" 'Konteks data' 'role-dashboard-v12'
          r13=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/workflow-v13.js)
          check "$r13" 'Released / Siap Produksi' 'workflow-v13'
          r14=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/governance-v14.js)
          check "$r14" 'Riwayat Aktivitas' 'governance-v14'
          check "$r14" '[disamarkan]' 'governance-v14'
          r16=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/data-governance-core-v16.js)
          check "$r16" 'DATA_GOVERNANCE' 'data-governance-v16'
          r17=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/uat-release-core-v17.js)
          check "$r17" 'UAT' 'uat-release-v17'
          r18=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/release-status-v18.js)
          check "$r18" 'Workflow Consistency' 'release-status-v18'
          check "$r18" '/workflow-health' 'release-status-v18'
          check "$r18" 'Source Mirror Consistency' 'release-status-v18'
          check "$r18" '/mirror-health' 'release-status-v18'
          check "$r18" 'Shopfloor Invariants' 'release-status-v18'
          check "$r18" '/runtime-invariants' 'release-status-v18'
          r20=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/machine-governance-v20.js)
          check "$r20" 'machine' 'machine-governance-v20'
          r21=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/support-recovery-v21.js)
          check "$r21" 'Dukungan & Pemulihan' 'support-recovery-v21'
          check "$r21" 'workflow + mirror + shopfloor invariant' 'support-recovery-v21'
          r22=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/uat-release-edit-v17.js)
          check "$r22" 'uatNative' 'uat-release-edit-v17'
          r23=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/release-polish-v23.js)
          check "$r23" 'rp23RowForm' 'release-polish-v23'
          check "$r23" 'Belum ada sheet sumber' 'release-polish-v23'
          check "$r23" "'webp'" 'release-polish-v23'
          r25=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/module-table-v25.js)
          check "$r25" 'Good / NC / Reject' 'module-table-v25'
          check "$r25" 'Verifikasi hasil' 'module-table-v25'
          check "$r25" 'Satuan dan sumber dipertahankan' 'module-table-v25'
          r26=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/archive-semantic-v26.js)
          check "$r26" 'koordinat Excel tetap ditampilkan' 'archive-semantic-v26'
          check "$r26" 'Header bisnis belum dapat disimpulkan secara aman' 'archive-semantic-v26'
          r27=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/settings-polish-v27.js)
          check "$r27" 'JSON lanjutan' 'settings-polish-v27'
          check "$r27" 'Scope konfigurasi dikunci ke department' 'settings-polish-v27'
          check "$r27" 'Definisi Data & KPI' 'settings-polish-v27'
          r28=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/access-governance-v28.js)
          check "$r28" 'Daftar akses pengguna' 'access-governance-v28'
          check "$r28" 'Admin Department' 'access-governance-v28'
          check "$r28" 'View only' 'access-governance-v28'
          r29=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/display-lifecycle-v29.js)
          check "$r29" 'Layout Mesin Baru' 'display-lifecycle-v29'
          check "$r29" 'Duplikat dibuat sebagai Draft tanpa assignment mesin' 'display-lifecycle-v29'
          check "$r29" 'Salin Link Display' 'display-lifecycle-v29'
          r30=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/import-center-v30.js)
          check "$r30" 'Paket lolos validasi lokal' 'import-center-v30'
          check "$r30" 'D1 belum berubah' 'import-center-v30'
          check "$r30" 'bukan payload base64 yang valid' 'import-center-v30'
          r31=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/operational-control-runtime-v31.js)
          check "$r31" 'Belum dapat dipilih otomatis' 'operational-control-v31'
          check "$r31" 'Reason baseline wajib' 'operational-control-v31'
          check "$r31" "process:'quality'" 'operational-control-v31'
          r33=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/release-resilience-v33.js)
          check "$r33" 'Belum ada sheet sumber' 'release-resilience-v33'
          check "$r33" "webp:'image/webp'" 'release-resilience-v33'
          check "$r33" "svg:'image/svg+xml'" 'release-resilience-v33'
          check "$r33" '/api/files/' 'release-resilience-v33'
          check "$r33" 'arrayBuffer()' 'release-resilience-v33'
          r34=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/dashboard-period-v34.js)
          check "$r34" 'excelEpoch' 'dashboard-period-v34'
          check "$r34" 'periode berasal dari cell tanggal sumber' 'dashboard-period-v34'
          r69=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/integration-safety-v69.js)
          check "$r69" 'PRODUCTION CONNECTION POLICY' 'integration-safety-v69'
          r70=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/navigation-integrity-v70.js)
          check "$r70" 'Operational Inbox' 'navigation-integrity-v70'
          r71=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/live-monitoring-v71.js)
          check "$r71" 'data-machine-code' 'live-monitoring-v71'
          check "$r71" 'telemetryMap' 'live-monitoring-v71'
          runtime=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/runtime-polish-v6.js)
          check "$runtime" 'Memuat data operasional' 'runtime-polish-v6'
          check "$runtime" 'Data belum dapat dimuat' 'runtime-polish-v6'
      - name: Production protected endpoint check
        run: |
          for endpoint in me approvals role-dashboard shopfloor/plans workflow-health mirror-health runtime-invariants telemetry-status; do
            tmp=$(mktemp)
            code=$(curl --silent --show-error --location --max-time 20 -o "$tmp" -w '%{http_code}' "https://oee-collaboraction.offsetbmj.workers.dev/api/$endpoint")
            cat "$tmp"
            test "$code" = "401"
            grep -Fq 'Silakan login kembali' "$tmp"
          done
          tmp=$(mktemp)
          code=$(curl --silent --show-error --location --max-time 20 -X POST -H 'Content-Type: application/json' -d '{}' -o "$tmp" -w '%{http_code}' https://oee-collaboraction.offsetbmj.workers.dev/api/shopfloor/start)
          cat "$tmp"
          test "$code" = "401"
          grep -Fq 'Silakan login kembali' "$tmp"
