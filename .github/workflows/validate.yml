name: Validate OEE Collaboraction
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend JavaScript
        run: |
          for f in frontend/*.js; do echo "Checking $f"; node --check "$f"; done
      - name: Validate frontend asset integrity
        run: node scripts/validate-frontend-assets.mjs
      - name: Validate role UX policy
        run: node scripts/validate-role-ux.mjs
      - name: Validate active navigation coverage
        run: node scripts/validate-navigation.mjs
      - name: Validate login and session flow
        run: node scripts/validate-auth-flow.mjs
      - name: Validate release blueprint coverage
        run: node scripts/validate-release-v10.mjs
      - name: Validate final release blueprint
        run: node scripts/validate-release-final.mjs
      - name: Validate release polish v23
        run: node scripts/validate-release-v23.mjs
      - name: Validate module tables v25
        run: node scripts/validate-module-table-v25.mjs
      - name: Validate semantic archive v26
        run: node scripts/validate-archive-v26.mjs
      - name: Validate Worker modules
        run: |
          for f in backend/*.mjs edge-agent/*.mjs scripts/*.mjs; do echo "Checking $f"; node --check "$f"; done
      - name: Validate backend authorization policy
        run: node scripts/validate-authz.mjs
      - name: Production Worker health check
        run: |
          curl --fail --location --max-time 20 --show-error https://oee-collaboraction.offsetbmj.workers.dev/api/health
      - name: Production build version check
        run: |
          body=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/api/version)
          echo "$body"
          echo "$body" | grep -Fq '"version":"6.2.0"'
          echo "$body" | grep -Fq '"storage":"D1-only"'
          echo "$body" | grep -Fq '"r2":false'
      - name: Production D1 readiness check
        run: |
          tmp=$(mktemp)
          code=$(curl --silent --show-error --location --max-time 20 -o "$tmp" -w '%{http_code}' https://oee-collaboraction.offsetbmj.workers.dev/api/readiness)
          cat "$tmp"
          test "$code" = "200"
          grep -Fq '"ready":true' "$tmp"
          grep -Fq '"schema":"ready"' "$tmp"
      - name: Production frontend and BMJ asset smoke check
        run: |
          html=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/)
          echo "$html" | grep -Fq 'BMJ OEE Platform | Packaging Offset'
          echo "$html" | grep -Fq 'id="app"'
          for asset in role-ux-v7.js field-display-v8.js release-v10.js release-v11.js role-dashboard-v12.js workflow-v13.js governance-v14.js data-governance-core-v16.js data-governance-view-v16.js data-governance-edit-v16.js machine-governance-v20.js uat-release-core-v17.js uat-release-view-v17.js uat-release-edit-v17.js release-status-v18.js support-recovery-v21.js release-polish-v23.js module-table-v25.js archive-semantic-v26.js; do echo "$html" | grep -Fq "$asset"; done
          for asset in release-v10.css release-v11.css role-dashboard-v12.css workflow-v13.css governance-v14.css data-governance-v16.css uat-release-v17.css release-status-v18.css support-recovery-v21.css release-polish-v23.css module-table-v25.css archive-semantic-v26.css; do curl --fail --silent --show-error --location --max-time 20 -o /dev/null "https://oee-collaboraction.offsetbmj.workers.dev/$asset"; done
          curl --fail --silent --show-error --location --max-time 20 -o /dev/null https://oee-collaboraction.offsetbmj.workers.dev/assets/logo-bmj-source.webp
          curl --fail --silent --show-error --location --max-time 20 -o /dev/null https://oee-collaboraction.offsetbmj.workers.dev/assets/hero-bmj-photo.jpg
      - name: Production field display publish guard check
        run: |
          js=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/field-display-v8.js)
          echo "$js" | grep -Fq "layout.status==='published'"
          echo "$js" | grep -Fq 'Display belum siap ditayangkan'
          release=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/release-v10.js)
          echo "$release" | grep -Fq 'filter(m=>normalize(m.code)===code)'
      - name: Production release workflow smoke check
        run: |
          r10=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/release-v10.js)
          echo "$r10" | grep -Fq 'Tata Kelola & Readiness'
          echo "$r10" | grep -Fq 'Pusat Data & Dokumen'
          echo "$r10" | grep -Fq 'barcodePlanScan'
          r11=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/release-v11.js)
          echo "$r11" | grep -Fq 'Approval & Verifikasi'
          echo "$r11" | grep -Fq 'Close Maintenance'
          r12=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/role-dashboard-v12.js)
          echo "$r12" | grep -Fq '/role-dashboard?department='
          echo "$r12" | grep -Fq 'Konteks data'
          r13=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/workflow-v13.js)
          echo "$r13" | grep -Fq 'Released / Siap Produksi'
          r14=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/governance-v14.js)
          echo "$r14" | grep -Fq 'Audit Log'
          echo "$r14" | grep -Fq '[disamarkan]'
          r16=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/data-governance-core-v16.js)
          echo "$r16" | grep -Fq 'DATA_GOVERNANCE'
          r17=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/uat-release-core-v17.js)
          echo "$r17" | grep -Fq 'UAT'
          r18=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/release-status-v18.js)
          echo "$r18" | grep -Fq 'release'
          r20=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/machine-governance-v20.js)
          echo "$r20" | grep -Fq 'machine'
          r21=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/support-recovery-v21.js)
          echo "$r21" | grep -Fq 'Dukungan & Pemulihan'
          r22=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/uat-release-edit-v17.js)
          echo "$r22" | grep -Fq 'uatNative'
          r23=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/release-polish-v23.js)
          echo "$r23" | grep -Fq 'rp23RowForm'
          echo "$r23" | grep -Fq 'Belum ada sheet sumber'
          echo "$r23" | grep -Fq "'webp'"
          r25=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/module-table-v25.js)
          echo "$r25" | grep -Fq 'Good / NC / Reject'
          echo "$r25" | grep -Fq 'Satuan dan sumber dipertahankan'
          r26=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/archive-semantic-v26.js)
          echo "$r26" | grep -Fq 'koordinat Excel tetap ditampilkan'
          echo "$r26" | grep -Fq 'Header bisnis belum dapat disimpulkan secara aman'
          runtime=$(curl --fail --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/runtime-polish-v6.js)
          echo "$runtime" | grep -Fq 'Memuat data operasional'
          echo "$runtime" | grep -Fq 'Data belum dapat dimuat'
      - name: Production protected endpoint check
        run: |
          for endpoint in me approvals role-dashboard shopfloor/plans; do
            tmp=$(mktemp)
            code=$(curl --silent --show-error --location --max-time 20 -o "$tmp" -w '%{http_code}' "https://oee-collaboraction.offsetbmj.workers.dev/api/$endpoint")
            cat "$tmp"
            test "$code" = "401"
            grep -Fq 'Silakan login kembali' "$tmp"
          done
          tmp=$(mktemp)
          code=$(curl --silent --show-error --location --max-time 20 -X POST -H 'Content-Type: application/json' -d '{}' -o "$tmp" -w '%{http_code}' https://oee-collaboraction.offsetbmj.workers.dev/api/shopfloor/start)
          cat "$tmp"
          test "$code" = "401"
          grep -Fq 'Silakan login kembali' "$tmp"
