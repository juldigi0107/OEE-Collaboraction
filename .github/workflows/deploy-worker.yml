name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'wrangler.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Deploy OEE Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy
      - name: Verify production version and fingerprint
        run: |
          expected='6.2.0'
          for attempt in $(seq 1 12); do
            body=$(curl --silent --show-error --location --max-time 20 https://oee-collaboraction.offsetbmj.workers.dev/api/version || true)
            echo "Attempt $attempt: $body"
            ok=1
            echo "$body" | grep -Fq "\"version\":\"$expected\"" || ok=0
            echo "$body" | grep -Fq '"storage":"D1-only"' || ok=0
            echo "$body" | grep -Fq '"r2":false' || ok=0
            echo "$body" | grep -Fq 'operational-control-v31' || ok=0
            echo "$body" | grep -Fq 'release-resilience-v33' || ok=0
            echo "$body" | grep -Fq 'period-aware-dashboard-v34' || ok=0
            if [ "$ok" = "1" ]; then
              echo "Cloudflare production verified: $expected + release fingerprint"
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare deployment did not expose expected version/fingerprint"
          exit 1
      - name: Verify production readiness
        run: |
          curl --fail --location --max-time 20 --show-error https://oee-collaboraction.offsetbmj.workers.dev/api/readiness
