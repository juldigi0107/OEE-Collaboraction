name: Validate Flagship Finish v97
on:
  push:
    branches: [main]
    paths:
      - 'frontend/flagship-finish-v97.css'
      - 'frontend/flagship-finish-v97.js'
      - 'frontend/index.html'
      - 'scripts/validate-flagship-v97.mjs'
      - '.github/workflows/flagship-v97.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/flagship-finish-v97.css'
      - 'frontend/flagship-finish-v97.js'
      - 'frontend/index.html'
      - 'scripts/validate-flagship-v97.mjs'
      - '.github/workflows/flagship-v97.yml'
permissions:
  contents: read
jobs:
  flagship-v97:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate flagship finish source
        run: |
          node --check frontend/flagship-finish-v97.js
          node scripts/validate-flagship-v97.mjs
      - name: Verify flagship v97 on production Worker
        if: github.event_name == 'push'
        run: |
          base='https://oee-collaboraction.offsetbmj.workers.dev'
          ready=0
          for attempt in $(seq 1 24); do
            html=$(curl --silent --show-error --location --max-time 20 "$base/" || true)
            css=$(curl --silent --show-error --location --max-time 20 "$base/flagship-finish-v97.css?v=20260917-1" || true)
            js=$(curl --silent --show-error --location --max-time 20 "$base/flagship-finish-v97.js?v=20260917-1" || true)
            ok=1
            printf '%s' "$html" | grep -Fq 'flagship-finish-v97.css?v=20260917-1' || ok=0
            printf '%s' "$html" | grep -Fq 'flagship-finish-v97.js?v=20260917-1' || ok=0
            printf '%s' "$html" | grep -Fq 'flagship-master-v96 flagship-v97' || ok=0
            printf '%s' "$css" | grep -Fq 'Flagship Finish v97' || ok=0
            printf '%s' "$css" | grep -Fq 'font-size:16px!important' || ok=0
            printf '%s' "$css" | grep -Fq '@media(prefers-reduced-motion:reduce)' || ok=0
            printf '%s' "$js" | grep -Fq 'collisionGuard' || ok=0
            printf '%s' "$js" | grep -Fq 'v97ContrastFix' || ok=0
            printf '%s' "$js" | grep -Fq 'ResizeObserver' || ok=0
            if [ "$ok" = '1' ]; then
              echo "Production Worker serves Flagship Finish v97 on attempt $attempt"
              ready=1
              break
            fi
            echo "Waiting for v97 production convergence ($attempt/24)"
            sleep 5
          done
          test "$ready" = '1'
