name = "oee-collaboraction"
main = "worker-v4.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://oee-collaboraction.offsetbmj.workers.dev,https://juldigi0107.github.io"

[assets]
directory = "../frontend"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "oee-collaboraction"
database_id = "85624616-87c2-45d4-a4cf-49c0544e163a"
